[project]
name = "minivllm"
version = "0.1.0"
description = "A minimal LLM inference engine with a paged KV cache and continuous batching."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "numpy>=1.26",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]

[project.scripts]
minivllm-serve = "minivllm.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minivllm"]

[tool.ruff]
line-length = 100
